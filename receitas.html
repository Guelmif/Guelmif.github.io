---
layout: default
title: Calculadora de Receitas
---

<div class="container">

    <div class="card">

        <h2>Ingredientes</h2>

        <div id="ingredientes"></div>

        <button onclick="adicionarIngrediente()">
            ➕ Adicionar Ingrediente
        </button>

    </div>

    <div class="card">

        <h2>Produção</h2>

        <label>Quantidade Produzida</label>
        <input type="number" id="rendimento" value="1">

        <label>Lucro Desejado (%)</label>
        <input type="number" id="lucro" value="100">

        <button onclick="calcular()">
            🧮 Calcular
        </button>

    </div>

    <div class="card resultado">

        <h2>Resultado</h2>

        <p id="custoTotal">
            Custo Total: R$ 0,00
        </p>

        <p id="custoUnitario">
            Custo Unitário: R$ 0,00
        </p>

        <p id="precoVenda">
            Preço de Venda: R$ 0,00
        </p>

    </div>

</div>

<style>

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

.item{
    border:1px solid #eee;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    background:#fafafa;
}

input, select{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005fa3;
}

.remover{
    background:#d13438;
}

.remover:hover{
    background:#a4262c;
}

.resultado{
    background:#f0fff4;
}

.embalagem{
    display:none;
    border-left:4px solid #0078d4;
    padding-left:10px;
    margin-top:10px;
}

</style>

<script>

let contador = 0;

function adicionarIngrediente(){

    contador++;

    let html = `

    <div class="item">

        <h3>Ingrediente ${contador}</h3>

        <label>Nome</label>
        <input class="nome">

        <label>Quantidade Comprada</label>
        <input type="number" class="comprada">

        <label>Unidade Comprada</label>
        <select class="unidadeComprada"
                onchange="mostrarConteudo(this)">

            <option value="kg">Kg</option>
            <option value="g">Gramas</option>
            <option value="L">Litros</option>
            <option value="ml">ml</option>
            <option value="un">Unidade</option>
            <option value="caixa">Caixa</option>
            <option value="pacote">Pacote</option>
            <option value="lata">Lata</option>

        </select>

        <div class="embalagem">

            <h4>Conteúdo da Embalagem</h4>

            <label>Quantidade</label>
            <input type="number" class="conteudo">

            <label>Unidade</label>
            <select class="unidadeConteudo">

                <option value="g">Gramas</option>
                <option value="kg">Kg</option>
                <option value="ml">ml</option>
                <option value="L">Litros</option>
                <option value="un">Unidade</option>

            </select>

        </div>

        <label>Preço Pago (R$)</label>
        <input type="number" step="0.01" class="preco">

        <label>Quantidade Utilizada</label>
        <input type="number" class="usada">

        <label>Unidade Utilizada</label>
        <select class="unidadeUsada">

            <option value="g">Gramas</option>
            <option value="kg">Kg</option>
            <option value="ml">ml</option>
            <option value="L">Litros</option>
            <option value="un">Unidade</option>

        </select>

        <button
            class="remover"
            onclick="this.parentElement.remove()">

            🗑 Remover

        </button>

    </div>

    `;

    document
        .getElementById("ingredientes")
        .insertAdjacentHTML("beforeend", html);
}

function mostrarConteudo(select){

    const embalagem =
        select.parentElement.querySelector(".embalagem");

    if(
        select.value === "caixa" ||
        select.value === "pacote" ||
        select.value === "lata"
    ){
        embalagem.style.display = "block";
    }
    else{
        embalagem.style.display = "none";
    }
}

function converter(valor, unidade){

    switch(unidade){

        case "kg":
            return valor * 1000;

        case "L":
            return valor * 1000;

        default:
            return valor;
    }
}

function grupo(unidade){

    if(
        unidade === "kg" ||
        unidade === "g"
    ){
        return "peso";
    }

    if(
        unidade === "L" ||
        unidade === "ml"
    ){
        return "volume";
    }

    return "unidade";
}

function calcular(){

    let total = 0;

    const compradas =
        document.querySelectorAll(".comprada");

    const usadas =
        document.querySelectorAll(".usada");

    const precos =
        document.querySelectorAll(".preco");

    const unidadesCompra =
        document.querySelectorAll(".unidadeComprada");

    const unidadesUso =
        document.querySelectorAll(".unidadeUsada");

    const conteudos =
        document.querySelectorAll(".conteudo");

    const unidadesConteudo =
        document.querySelectorAll(".unidadeConteudo");

    for(let i = 0; i < compradas.length; i++){

        let preco =
            parseFloat(precos[i].value) || 0;

        let qtdComprada =
            parseFloat(compradas[i].value) || 0;

        let qtdUsada =
            parseFloat(usadas[i].value) || 0;

        let unidadeCompra =
            unidadesCompra[i].value;

        let unidadeUso =
            unidadesUso[i].value;

        if(
            unidadeCompra === "caixa" ||
            unidadeCompra === "pacote" ||
            unidadeCompra === "lata"
        ){

            let conteudo =
                parseFloat(conteudos[i].value) || 0;

            let unidadeConteudo =
                unidadesConteudo[i].value;

            if(
                grupo(unidadeConteudo) !== grupo(unidadeUso)
            ){
                alert(
                    "As unidades do ingrediente "
                    + (i + 1)
                    + " são incompatíveis."
                );
                return;
            }

            qtdComprada =
                qtdComprada *
                converter(
                    conteudo,
                    unidadeConteudo
                );

        }
        else{

            if(
                grupo(unidadeCompra) !== grupo(unidadeUso)
            ){
                alert(
                    "As unidades do ingrediente "
                    + (i + 1)
                    + " são incompatíveis."
                );
                return;
            }

            qtdComprada =
                converter(
                    qtdComprada,
                    unidadeCompra
                );
        }

        qtdUsada =
            converter(
                qtdUsada,
                unidadeUso
            );

        if(qtdComprada > 0){

            total +=
                (preco / qtdComprada)
                * qtdUsada;
        }

    }

    let rendimento =
        parseFloat(
            document.getElementById("rendimento").value
        ) || 1;

    let lucro =
        parseFloat(
            document.getElementById("lucro").value
        ) || 0;

    let custoUnitario =
        total / rendimento;

    let precoVenda =
        custoUnitario *
        (1 + (lucro / 100));

    document
        .getElementById("custoTotal")
        .innerHTML =
        `Custo Total: R$ ${total.toFixed(2)}`;

    document
        .getElementById("custoUnitario")
        .innerHTML =
        `Custo Unitário: R$ ${custoUnitario.toFixed(2)}`;

    document
        .getElementById("precoVenda")
        .innerHTML =
        `Preço de Venda: R$ ${precoVenda.toFixed(2)}`;
}

adicionarIngrediente();

</script>
